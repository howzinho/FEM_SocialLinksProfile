<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />

    <title>Frontend Mentor | Social links profile</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <figure><img class="prof-pic" src="assets/images/avatar-jessica.jpeg" alt="Authors picture" /></figure>
      <h1>Jessica Randall</h1>
      <address>London, United Kingdom</address>
      <div class="bio">"Front-end developer and avid reader."</div>
      <button class="socials">GitHub</button>
      <button class="socials">Frontend Mentor</button>
      <button class="socials">LinkedIn</button>
      <button class="socials">Twitter</button>
      <button class="socials">Instagram</button>
    </main>

    <footer>
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. Coded by
      <a href="https://github.com/howzinho">Howzinho</a>.
    </footer>
  </body>
</html>
